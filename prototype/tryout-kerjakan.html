<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerjakan Try Out &mdash; LONTAR CPNS Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230191ED'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
  .exam-note { font-size: var(--fs-xs); color: #A9C1D6; }
  @media (max-width: 680px) { .exam-note { display: none; } }
</style>
</head>
<body data-bank="skd-5">

<a class="skip-link" href="#main">Lompat ke konten utama</a>

<!-- ============ TOP BAR ============ -->
<header class="tryout-bar">
  <div class="container container--wide tryout-bar__inner">
    <a class="logo" href="tryout.html" aria-label="Kembali ke daftar tryout">
      <span class="logo__mark"><svg data-icon="book"></svg></span>
    </a>
    <div class="tryout-bar__meta">
      <strong>Tryout SKD #5 &mdash; Penuh</strong>
      <span class="exam-note">TWK &middot; TIU &middot; TKP &middot; 20 soal</span>
    </div>

    <div class="tryout-bar__right">
      <div class="timer" id="timerWrap">
        <svg data-icon="timer"></svg>
        <span id="timer">30:00</span>
      </div>
      <button class="btn btn--ghost btn--sm" type="button" id="filterUnanswered" aria-pressed="false">
        <svg data-icon="list-checks"></svg> Belum dijawab
      </button>
      <button class="btn btn--ghost btn--sm" type="button" id="exitBtn">
        <svg data-icon="logout"></svg> Keluar
      </button>
      <button class="btn btn--primary btn--sm" type="button" id="submitBtn">
        Kumpulkan<span class="btn__icon"><svg data-icon="check"></svg></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ LAYOUT ============ -->
<main class="container container--wide tryout-layout" id="main">

  <div id="questionStage">
    <noscript>
      <div class="alert alert--danger">
        <span class="alert__icon"><svg data-icon="alert"></svg></span>
        <div>Modul tryout membutuhkan JavaScript. Aktifkan JavaScript pada browser kamu.</div>
      </div>
    </noscript>
  </div>

  <aside class="qnav" aria-label="Navigasi nomor soal">
    <div class="card card--tight">
      <div class="card__head" style="margin-bottom:.85rem">
        <div>
          <div class="card__title" style="font-size:var(--fs-base)">Nomor Soal</div>
          <div class="card__sub">Klik nomor untuk berpindah</div>
        </div>
      </div>

      <div class="palette" id="palette"></div>

      <div class="legend" style="margin-top:1rem;padding-top:1rem;border-top:2px dashed var(--border)">
        <div class="legend__item"><span class="legend__swatch legend__swatch--answered"></span> Sudah dijawab</div>
        <div class="legend__item"><span class="legend__swatch"></span> Belum dijawab</div>
        <div class="legend__item"><span class="legend__swatch legend__swatch--flagged"></span> Ditandai</div>
        <div class="legend__item"><span class="legend__swatch legend__swatch--current"></span> Soal aktif</div>
      </div>
    </div>

    <div class="card card--tight" style="margin-top:1.25rem">
      <div class="kv">
        <div class="kv__row"><span class="kv__key">Dijawab</span><span class="kv__val" id="statAnswered">0/20</span></div>
        <div class="kv__row"><span class="kv__key">Belum dijawab</span><span class="kv__val" id="statLeft">20</span></div>
        <div class="kv__row"><span class="kv__key">Ditandai</span><span class="kv__val" id="statFlagged">0</span></div>
      </div>
    </div>

    <div class="card card--tight card--dashed" style="margin-top:1.25rem">
      <strong style="font-family:var(--font-display);font-size:var(--fs-sm);color:var(--ink);display:block;margin-bottom:.6rem">Pintasan Keyboard</strong>
      <div class="kv text-xs">
        <div class="kv__row"><span class="kv__key">A sampai E</span><span class="kv__val">pilih jawaban</span></div>
        <div class="kv__row"><span class="kv__key">Panah kiri / kanan</span><span class="kv__val">pindah soal</span></div>
        <div class="kv__row"><span class="kv__key">F</span><span class="kv__val">tandai soal</span></div>
      </div>
    </div>
  </aside>
</main>

<!-- ============ DATA SOAL (prototipe: 20 soal) ============ -->
<script src="assets/data/bank-skd-5.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/quiz.js"></script>
</body>
</html>
